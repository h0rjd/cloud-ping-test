name: Cloud 8-Node Reroll Cluster (224 Threads)

on:
  workflow_dispatch:
  schedule:
    - cron: "45 */5 * * *"

concurrency:
  group: cloud-reroll-cluster
  cancel-in-progress: true

jobs:
  reroll-shard:
    name: "Reroll Node #${{ matrix.shard }} (28 Threads)"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Vault & Run Reroll Shard
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REROLL_SHARD_ID: ${{ matrix.shard }}
          REROLL_CLUSTER_SIZE: "8"
          MAX_RUN_MINUTES: "335"
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/h0rjd/hactaydu-cloud-bot.git vault
          cd vault
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
          node cloud_reroll_shard.js
