name: Test Header Diag

on:
  workflow_dispatch:
    inputs:
      test:
        default: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run Test
        run: |
          cat << EOF > test.js

const https = require("https");

const headers = {
  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
  "Accept-Language": "vi-VN,vi;q=0.9,en-US;q=0.8,en;q=0.7"
};

function req(name, extra) {
  return new Promise(resolve => {
    const r = https.request("https://core.sdkmain.com/v1/apps/2a456b78cf5122cd9278ef24b4d7bfb9/9.9.9.5/register/phone?sdk_version=6.1.2&device_network=wifi&device_os=Android%2012&device_name=Pixel%207", {
      method: "GET",
      headers: { ...headers, ...extra }
    }, res => {
      let b = "";
      res.on("data", c => b += c);
      res.on("end", () => {
        console.log(`TEST [${name}]: ${res.statusCode} | token: ${b.includes("_token")} | len: ${b.length}`);
        resolve();
      });
    });
    r.on("error", e => { console.log(name, e.message); resolve(); });
    r.end();
  });
}

async function main() {
  await req("Direct", {});
  await req("X-Forwarded-For", { "X-Forwarded-For": "113.161.72.10" });
  await req("X-Real-IP", { "X-Real-IP": "113.161.72.10" });
  await req("CF-Connecting-IP", { "CF-Connecting-IP": "113.161.72.10" });
  await req("True-Client-IP", { "True-Client-IP": "113.161.72.10" });
  await req("All VN Headers", {
    "X-Forwarded-For": "113.161.72.10, 113.161.72.10",
    "X-Real-IP": "113.161.72.10",
    "CF-Connecting-IP": "113.161.72.10",
    "Client-IP": "113.161.72.10"
  });
}
main();

EOF
          node test.js
