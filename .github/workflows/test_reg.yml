name: Test Endpoints

on:
  workflow_dispatch:
    inputs:
      test:
        default: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run Test
        run: |
          cat << EOF > test.js

const https = require("https");

function check(url) {
  return new Promise(resolve => {
    https.get(url, { headers: { "User-Agent": "Mozilla/5.0" } }, res => {
      let b = "";
      res.on("data", c => b += c);
      res.on("end", () => {
        console.log(`URL: ${url} => Status: ${res.statusCode}, Body len: ${b.length}, Has _token: ${b.includes("_token")}`);
        resolve();
      });
    }).on("error", e => { console.log(url, e.message); resolve(); });
  });
}

async function main() {
  await check("https://id.funtap.vn/register");
  await check("https://core.sdkmain.com/v1/apps/2a456b78cf5122cd9278ef24b4d7bfb9/9.9.9.5/register/phone");
}
main();

EOF
          node test.js
